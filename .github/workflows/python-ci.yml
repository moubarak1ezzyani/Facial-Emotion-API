name: Tests Python

on:
  push:
    branches: [ main, feat/IV-tests-ci ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DB_USER: "postgres"
          DB_PASS: "test_pass"
          DB_HOST: "localhost"
          DB_NAME: "test_db"
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          # Only run tests if models exist (GitHub Actions might not have them)
          if [ -f "models/my_model_emotion_detection.keras" ]; then
            pytest tests/test_unitaire.py
          else
            echo "Skipping tests as models are missing in this environment."
          fi

